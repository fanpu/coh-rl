# Roster and authored decisions for tools/scrape_coh_stats.py.
#
# Everything in this file is scope + judgement: which coh-stats pages are in the
# M1 roster, which id each page gets, and the handful of facts the mirror does
# not state (squad weapon counts, building footprints, tech prerequisites).
# All *numbers* that the mirror does state are scraped, never written here.
#
# Source mirror: https://www.hq-coh.com/stats/coh-stats.com/ (Dec 2013 static
# copy of coh-stats.com, data ~2.600/2.601; patched forward by patch_2602.yaml).

source_base: "https://www.hq-coh.com/stats/coh-stats.com/"

# --- target types ---------------------------------------------------------------
# Weapon "Target Table" rows are labelled with display names; unit pages carry the
# internal target-type name. This maps display name -> internal name, and doubles
# as the filter: only these rows are kept in each weapon's target_table.
target_types:
  Infantry: infantry
  Infantry Sniper: infantry_sniper
  Infantry Heroic: infantry_heroic
  Towed Gun: towed_gun
  Jeep: vehicle_jeep
  Motorcycle: vehicle_motorcycle
  M3 Halftrack: vehicle_m3
  Sdkfz 251 Halftrack: vehicle_251
  Greyhound: vehicle_m8
  Sdkfz 234 Puma: vehicle_234
  M10 TD: armour_m10
  Sherman: armour_sherman
  StuG: armour_stug
  Panzer IV: armour_panzer
  Panther: armour_panther
  Flak Panzer: armour_ostwind
  Building: building
  Checkpoint: building_checkpoint

# --- weapons --------------------------------------------------------------------
