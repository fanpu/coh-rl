# --- squads ---------------------------------------------------------------------
# `loadout` is [weapon id, count] pairs. The mirror lists *which* weapons a squad
# carries but never how many of each, so the counts are authored (see estimated:
# notes emitted into squads.yaml). Vehicles carry all their default weapons on the
# single model, main gun first.
# `entity` is an omgmod entities.json reference, used only for infantry/team-weapon
# `speed` + `rotation_deg_s` and for `crushes_light_cover` (pass_type presence);
# vehicles take speed/rotation from their coh-stats page.
# `suppression_key` is the unit's row in Info:Suppression (per-faction table).
squads:
  engineers:
    page: Infantry_Engineers
    faction: us
    kind: infantry
    loadout: [[grease_gun, 3]]
    entity: ebps/races/allies/soldiers/engineer
