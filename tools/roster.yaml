# --- buildings ------------------------------------------------------------------
# `footprint` is authored: the mirror carries no building dimensions.
# `requires` is all-of. US prerequisites verified on Structure:Supply Yard
# ("Requires Barracks OR Weapons Support Center", "Unlocks Motor Pool / Tank
# Depot") and cross-checked on the fandom wiki (Motor Pool and Tank Depot both
# `prereq = An existing Supply Yard`). The OR is approximated by Barracks.
# Wehrmacht gating is the phase chain researched at the Reich HQ.
buildings:
  hq_us:
    page: Structure_American_Headquarters
    faction: us
    footprint: [5, 5]
    requires: []
    is_hq: true
  barracks_us:
    page: Structure_Barracks
    faction: us
    footprint: [4, 3]
    requires: [hq_us]
    is_hq: false
  weapons_support_center_us:
    page: Structure_Weapons_Support_Center
    faction: us
    footprint: [4, 3]
    requires: [hq_us]
    is_hq: false
  supply_yard_us:
    page: Structure_Supply_Yard
    faction: us
    footprint: [3, 3]
    requires: [barracks_us]
    is_hq: false
  motor_pool_us:
    page: Structure_Motor_Pool
    faction: us
    footprint: [4, 4]
    requires: [supply_yard_us]
    is_hq: false
  tank_depot_us:
    page: Structure_Tank_Depot
    faction: us
    footprint: [5, 4]
    requires: [supply_yard_us]
    is_hq: false
  op_us:
    page: Structure_American_Observation_Post
    faction: us
    footprint: [2, 2]
    requires: [hq_us]
    is_hq: false

  hq_wehr:
    page: Structure_Reich_Headquarters
    faction: wehr
    footprint: [5, 5]
    requires: []
    is_hq: true
  quarters_wehr:
    page: Structure_Wehrmacht_Quarters
    faction: wehr
    footprint: [4, 3]
    requires: [hq_wehr]
    is_hq: false
  krieg_barracks_wehr:
    page: Structure_Krieg_Barracks
    faction: wehr
    footprint: [4, 3]
    requires: [skirmish_phase]
    is_hq: false
  sturm_armory_wehr:
    page: Structure_Sturm_Armory
    faction: wehr
    footprint: [4, 4]
    requires: [assault_phase]
    is_hq: false
  panzer_command_wehr:
    page: Structure_Panzer_Command
    faction: wehr
    footprint: [5, 4]
    requires: [battle_phase]
    is_hq: false
  op_wehr:
    page: Structure_Wehrmacht_Observation_Post
    faction: wehr
    footprint: [2, 2]
    requires: [hq_wehr]
    is_hq: false

# --- global upgrades ------------------------------------------------------------
# upkeep_mult from the Supply Yard page effect text: "Decrease the Upkeep cost of
# your Troops by 25%" and "...by an additional 25%" (applied multiplicatively).
upgrades:
  supply_yard_l1:
    page: Upgrade_Level_1_Production
    faction: us
    requires: [supply_yard_us]
    upkeep_mult: 0.75
  supply_yard_l2:
    page: Upgrade_Level_2_Production
    faction: us
    requires: [supply_yard_l1]
    upkeep_mult: 0.75
  skirmish_phase:
    page: Upgrade_Escalate_to_Skirmish_Phase
    faction: wehr
    requires: [hq_wehr]
  assault_phase:
    page: Upgrade_Escalate_to_Assault_Phase
    faction: wehr
    requires: [skirmish_phase]
  battle_phase:
    page: Upgrade_Escalate_to_Battle_Phase
    faction: wehr
    requires: [assault_phase]

# --- per-squad weapon upgrades --------------------------------------------------
# `count` (member weapon slots replaced) is authored: the mirror states the cost,
# time, weapon and eligible squads but not how many models get the weapon.
# `requires` from the upgrade pages' "Upgraded At" / the phase pages' "Unlocks".
squad_upgrades:
  bar_riflemen:
    page: Upgrade_Browning_Automatic_Rifle
    applies_to: [riflemen]
    weapon: browning_automatic_rifle
    count: 2
    requires: [barracks_us]
  mp40_volksgrenadiers:
    page: "Upgrade_MP40_Sub-Machine_gun"
    applies_to: [volksgrenadiers]
    weapon: mp40
    count: 5
    requires: [skirmish_phase]
  mg42_lmg_grenadiers:
    page: Upgrade_MG42_Light_Machine_Gun
    applies_to: [grenadiers]
    weapon: mg42_lmg
    count: 1
    requires: [assault_phase]
  panzerschreck_grenadiers:
    page: Upgrade_Wehrmacht_Panzerschreck
    applies_to: [grenadiers]
    weapon: panzerschreck
    count: 2
    requires: [skirmish_phase]

