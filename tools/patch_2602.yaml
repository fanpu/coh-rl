# Forward-port of the official CoH 2.602 release notes onto the scraped
# ~2.600/2.601 coh-stats data.
#
# Source: https://www.gamereplays.org/community/Official_CoH_2602_Release_Notes-t782742.html
#
# Only deltas that touch a roster unit AND a field this project models are listed.
# `old` is asserted against the scraped value before `new` is written, so a change
# in the mirror or a misreading of the notes fails the scrape loudly.
#
# Notes-to-field mapping:
#   "Received Accuracy/Damage from X" -> X's weapon target_table row for the receiver
#   "Accuracy vs Y"                   -> this weapon's target_table row for Y
#
# Release-note items deliberately not encoded (field not modelled): pack-up times,
# ready-aim time, weapon-platform health (towed guns), reinforcement flat costs,
# acceleration/deceleration, veterancy, drop chances, barrage scatter, experience.
# Three items could not be reconciled with the scraped numbers and were dropped
# rather than guessed (see task-3-report.md): 57 mm "Received Damage vs Jeep
# 1.0->0.5" (scraped 1.5), Pak 38 "Received Accuracy vs moving Jeep 0.75->0.5"
# (scraped 0.6), BAR "Received Damage vs Heroic 0.85->0.78" (scraped damage 0.75).

patches:
