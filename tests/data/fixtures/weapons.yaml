source: "Hand-written fixture data for tests. Round numbers, not sourced from CoH1."

weapons:
  rifle:
    damage: 20
    ranges: [10, 20, 30]
    min_range: 0
    accuracy: [1.0, 0.5, 0.25]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.05, 0.04, 0.03]
    cooldown: [1.0, 2.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: null
    rate_of_fire: 1.0
    reload: [0.0, 0.0]
    reload_every: 1000
    moving_accuracy: 0.5
    target_table:
      armour_tank:
        damage: 0.01
    cover_table:
      heavy: {accuracy: 0.5, damage: 0.5, suppression: 0.1}
      light: {accuracy: 0.5, damage: 1.0, suppression: 0.5}
      negative: {accuracy: 1.25, damage: 1.25, suppression: 1.5}
      garrison: {accuracy: 0.4, damage: 0.75, suppression: 0.0}

  hmg:
    damage: 8
    ranges: [15, 25, 35]
    min_range: 0
    accuracy: [0.8, 0.6, 0.4]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.3, 0.25, 0.2]
    cooldown: [0.5, 1.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: [2.0, 3.0]
    rate_of_fire: 10.0
    reload: [3.0, 4.0]
    reload_every: 3
    setup_time: 3.0
    arc_deg: 90.0
    moving_accuracy: 0.0
    nearby_suppression_mult: 0.5
    nearby_suppression_radius: 6.0
    cover_table:
      heavy: {accuracy: 0.5, damage: 0.5, suppression: 0.1}
      light: {accuracy: 0.5, damage: 1.0, suppression: 0.5}
      negative: {accuracy: 1.25, damage: 1.25, suppression: 1.5}
      garrison: {accuracy: 0.4, damage: 0.75, suppression: 0.0}

  tank_gun:
    damage: 160
    ranges: [20, 35, 50]
    min_range: 0
    accuracy: [0.8, 0.6, 0.4]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.1, 0.1, 0.1]
    cooldown: [4.0, 5.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: null
    rate_of_fire: 1.0
    reload: [0.0, 0.0]
    reload_every: 1000
    moving_accuracy: 0.5
    deflection_damage_mult: 0.1
    target_table:
      armour_tank: {penetration: 0.5, rear_penetration: 2.0}

  at_gun:
    damage: 160
    ranges: [20, 35, 50]
    min_range: 0
    accuracy: [0.8, 0.6, 0.4]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.1, 0.1, 0.1]
    cooldown: [4.0, 5.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: null
    rate_of_fire: 1.0
    reload: [0.0, 0.0]
    reload_every: 1000
    setup_time: 2.0
    arc_deg: 60.0
    moving_accuracy: 0.0
    target_table:
      armour_tank: {penetration: 0.5, rear_penetration: 2.0}

  mortar:
    damage: 60
    ranges: [15, 30, 45]
    min_range: 10
    accuracy: [0.6, 0.6, 0.6]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.2, 0.2, 0.2]
    cooldown: [3.0, 4.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: null
    rate_of_fire: 1.0
    reload: [0.0, 0.0]
    reload_every: 1000
    setup_time: 3.0
    indirect: true
    scatter_m: 3.0
    aoe_radius: 4.0

  # Task 11 fixture: a hull-mounted vehicle gun — no turret, 60-degree hull
  # arc, so the vehicle has to turn its whole hull onto a target.
  hull_gun:
    damage: 160
    ranges: [20, 35, 50]
    min_range: 0
    accuracy: [0.8, 0.6, 0.4]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.1, 0.1, 0.1]
    cooldown: [4.0, 5.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: null
    rate_of_fire: 1.0
    reload: [0.0, 0.0]
    reload_every: 1000
    arc_deg: 60.0
    moving_accuracy: 0.5
    deflection_damage_mult: 0.1
    target_table:
      armour_tank: {penetration: 0.5, rear_penetration: 2.0}

  # Task 11 fixtures: the two duellists of `tests/sim/test_vehicles.py`. Their
  # numbers exist to give the AT-gun-vs-tank duel a clear expected winner in
  # each starting geometry, and nothing else uses them:
  #   * `at_gun_duel` kills a 400 HP tank in ~3 penetrating hits (~11 s), but
  #     its deliberately long `setup_time` makes swinging onto a tank that
  #     started behind it cost ~32 s;
  #   * `duel_tank_gun` needs ~7 hits (~26 s) to kill the 3-model crew.
  # So the gun wins frontally and loses when it has to turn first.
  at_gun_duel:
    damage: 160
    ranges: [20, 35, 50]
    min_range: 0
    accuracy: [0.8, 0.8, 0.8]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.1, 0.1, 0.1]
    cooldown: [3.0, 3.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: null
    rate_of_fire: 1.0
    reload: [0.0, 0.0]
    reload_every: 1000
    setup_time: 16.0
    arc_deg: 60.0
    moving_accuracy: 0.0
    deflection_damage_mult: 0.25
    target_table:
      armour_tank: {penetration: 1.0, rear_penetration: 2.0}

  duel_tank_gun:
    damage: 160
    ranges: [20, 35, 50]
    min_range: 0
    accuracy: [0.8, 0.8, 0.8]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.1, 0.1, 0.1]
    cooldown: [3.0, 3.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: null
    rate_of_fire: 1.0
    reload: [0.0, 0.0]
    reload_every: 1000
    moving_accuracy: 0.5
    deflection_damage_mult: 0.1
    target_table:
      infantry: {damage: 0.25}
      armour_tank: {penetration: 0.5, rear_penetration: 2.0}

  # Task 14 fixture: the weapon the `bar` squad upgrade swaps in.
  bar:
    damage: 30
    ranges: [10, 20, 30]
    min_range: 0
    accuracy: [1.0, 0.6, 0.3]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.06, 0.05, 0.04]
    cooldown: [1.0, 2.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: null
    rate_of_fire: 1.0
    reload: [0.0, 0.0]
    reload_every: 1000
    moving_accuracy: 0.5
    target_table:
      armour_tank:
        damage: 0.01

  # Task 12 fixture: a rifle that can barely scratch a building. The plain
  # `rifle` above has no `building_light` row, so it falls back to a damage
  # multiplier of 1.0 and would rather shoot the house than the squad inside
  # it; this one lets `tests/sim/test_garrison.py` stage a squad-vs-squad
  # garrison duel. Identical to `rifle` in every other respect.
  garrison_rifle:
    damage: 20
    ranges: [10, 20, 30]
    min_range: 0
    accuracy: [1.0, 0.5, 0.25]
    penetration: [1.0, 1.0, 1.0]
    suppression: [0.05, 0.04, 0.03]
    cooldown: [1.0, 2.0]
    cooldown_range_mult: [1.0, 1.0, 1.0]
    burst: null
    rate_of_fire: 1.0
    reload: [0.0, 0.0]
    reload_every: 1000
    moving_accuracy: 0.5
    target_table:
      armour_tank: {damage: 0.01}
      building_light: {damage: 0.05}
      building_heavy: {damage: 0.05}
    cover_table:
      heavy: {accuracy: 0.5, damage: 0.5, suppression: 0.1}
      light: {accuracy: 0.5, damage: 1.0, suppression: 0.5}
      negative: {accuracy: 1.25, damage: 1.25, suppression: 1.5}
      garrison: {accuracy: 0.4, damage: 0.75, suppression: 0.0}
