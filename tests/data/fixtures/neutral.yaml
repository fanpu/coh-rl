    hp: 400
    target_type: building_light
    capacity: 1
    footprint: [3, 3]

  house_large:
    hp: 700
    target_type: building_light
    capacity: 2
    footprint: [4, 4]

  barn:
    hp: 900
    target_type: building_light
    capacity: 3
    footprint: [5, 4]
