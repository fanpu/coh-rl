  # Task 14 fixture: a miniature two-tier tech tree per faction.
  # US gates its tier-2 building on a *building* (barracks -> tank_depot);
  # Wehrmacht gates it on a researched *upgrade* (phase_2 -> panzer_command).
  # Both produce the shared `tank` fixture squad (faction is enforced on the
  # producing building, not on the unit it spits out).
  tank_depot:
    faction: us
    cost: {manpower: 300, fuel: 60}
    build_time: 40
    hp: 800
    target_type: building_light
    footprint: [3, 3]
