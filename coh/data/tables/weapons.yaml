# Generated by tools/scrape_coh_stats.py. Do not edit by hand.
source: coh-stats.com mirror https://www.hq-coh.com/stats/coh-stats.com/ (static Dec 2013 copy, data ~2.600/2.601),
  forward-ported with the official 2.602 release notes https://www.gamereplays.org/community/Official_CoH_2602_Release_Notes-t782742.html;
  infantry and team-weapon speed and rotation from omgmod entities.json https://raw.githubusercontent.com/omgmod/omg_rails/master/lib/assets/stats/entities.json.
  Generated by tools/scrape_coh_stats.py -- do not edit by hand.
estimated:
  '*.cover_table': The page's 'Open' cover row (accuracy 1.25) is a distinct cover type that coh-stats'
    own Info:Weapon Statistics records as unused in game, so it is not emitted; our `open` (= no cover)
    falls back to the identity mods, which equal the page's 'Default' row (1/1/1) for every weapon scraped.
  '*.cover_table.penetration': The page's cover table has a penetration column (e.g. 37 mm Greyhound vs
    heavy cover 0.5); CoverMods has no penetration field, so it is dropped.
  '*.damage': Pages give a min-max damage pair; the mean is used (equal for all but flame weapons).
  '*.rate_of_fire': Single-shot weapons list 0 bullets/s; 1 bullet per firing cycle is used instead.
  mortar_60mm.scatter_m: Derived as the page's Scatter Max x Scatter Ratio; the source models scatter
    as an angle plus distance ratio, not a metre standard deviation.
  mortar_81mm.scatter_m: Derived as the page's Scatter Max x Scatter Ratio; the source models scatter
    as an angle plus distance ratio, not a metre standard deviation.
