# Point layout. The map is a 180-degree rotationally symmetric 1v1: sector A
# (NW, slot 0's base) pairs with M (SE, slot 1's base), B with L, C with K,
# D with J, E with I, F with H, and G is the centre sector. Every point's
# cell is the EXACT rotational image (x, y) -> (95 - x, 95 - y) of its
# partner's, and both partners carry the SAME type, so each seat has the
# identical resource mix at identical path distances:
#
# In brackets: infantry BFS cells from that seat's own starting builder.
#
#   A / M   strategic        base sector, owned from the start (manpower + pop)
#   B / L   fuel_low    [20] the safe fuel cache next to each base
#   D / J   munitions_med [54] the flank munitions dump
#   E / I   fuel_high   [64] the corner fuel depot: the map's fuel prize,
#                            off each side's own flank
#   F / H   munitions_high [26] each side's half of the contested middle
#   C / K   victory     [32] north / south crossing
#   G       victory     [63] the centre crossroads
#
# A single centre point cannot be its own rotational image on an even grid,
# so `victory_mid` instead sits on a cell whose infantry BFS distance from
# both seats' builder spawns is exactly equal (63 cells); its rotational
# image, (48, 47), is the other equidistant cell of the crossroads. See
# tests/maps/test_hedgerow_crossing.py, which re-derives all of this.
points:
- id: base_nw
  name: NW Base Strongpoint
  type: strategic
