# The sim centres the HQ footprint on `hq_cell` (`Sim._hq_footprint_cell`:
# top-left = hq_cell - footprint // 2). With the 4x4 HQ of the stat tables
# every footprint side is even, and an even side has no centre cell, so the
# two seats' footprints are exact rotational images when their `hq_cell`s are
# images under x -> 96 - x (not 95 - x, which is the convention the point
# cells above use). (11, 17) and (85, 79) stamp x9-12/y15-18 and
# x83-86/y77-80, which are exact images under the grid rotation.
starts:
- slot: 0
  team: 0
  hq_cell:
  - 11
  - 17
  sector: A
- slot: 1
  team: 1
  hq_cell:
  - 85
  - 79
  sector: M
