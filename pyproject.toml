[project]
name = "coh"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coh"]
artifacts = [
    "coh/data/tables/*.yaml",
    "coh/maps/library/*.yaml",
]
# The viewer's static page (and its vendored three.js) live inside the package
# so `python -m coh.viewer` works from an installed wheel. They are tracked in
# git, so `packages = ["coh"]` already picks them up; this only guards against
# a future ignore rule quietly dropping them out of the wheel.
include = ["coh/viewer/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
