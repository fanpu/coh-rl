[project]
name = "coh"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coh"]
artifacts = [
    "coh/data/tables/*.yaml",
    "coh/maps/library/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
